# ============================================================
#  ADIM 2 — VERİTABANI + API
#
#  Artık iki kutu var: SQL Server ve ASP.NET Core API. İkisi de
#  senin bilgisayarında çalışıyor, sunucu yok. Adım 3'te Caddy
#  (HTTPS) eklenecek, adım 4'te aynı dosya sunucuya taşınacak.
#
#  ⚠️ WINDOWS'TAKİ MEVCUT SQL SERVER'INA DOKUNMUYORUZ.
#  O çalışmaya devam ediyor, verilerin yerinde duruyor.
#
#  ⚠️ `dotnet run` HÂLÂ ÇALIŞIYOR.
#  Konteyner API'si 5289'u kullandığı için ikisi aynı anda açık
#  olamaz — biri kapanacak. Kod yazarken `dotnet run` daha pratik
#  (anında yeniden derleme); konteyner "sunucuda nasıl davranacak"
#  sorusunun cevabı.
#
#  ----- KULLANIM -----
#    docker compose up -d --build → derle ve başlat
#    docker compose ps            → çalışıyor mu bak
#    docker compose logs -f api   → API günlükleri (Ctrl+C ile çık)
#    docker compose stop          → durdur (veri KALIR)
#    docker compose down          → durdur + kutuları sil (veri KALIR)
#    docker compose down -v       → ⚠️ VERİYİ DE SİLER
#
#  ⚠️ KOD DEĞİŞTİRİNCE `--build` ŞART. Onsuz Docker eski imajı
#  başlatır ve "değişikliğim neden görünmüyor" dersin.
# ============================================================

services:
  # "db" bu servisin adı. Aynı zamanda ağ adresi oluyor: 2. adımda
  # API container'ı veritabanına "db" diyerek ulaşacak.
  db:
    # Hazır kalıp (image). Microsoft'un resmi SQL Server 2022 imajı.
    # İlk `up` komutunda internetten iniyor (~1,5 GB), sonra yerelde
    # duruyor ve bir daha inmiyor.
    image: mcr.microsoft.com/mssql/server:2022-latest

    # Kutunun adı. Vermeseydik Docker rastgele bir ad üretirdi
    # ("eticaretapi-db-1" gibi) ve komutlarda onu yazmak gerekirdi.
    container_name: satik-db

    environment:
      # Lisans sözleşmesini kabul ediyoruz. Bu satır olmadan
      # SQL Server hiç açılmıyor.
      ACCEPT_EULA: "Y"

      # ⚠️ ŞİFRE BU DOSYADA YAZMIYOR — .env dosyasından geliyor.
      # Buraya yazsaydık repoya girer ve herkes görürdü.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

      # ⚠️ NEDEN Express, NEDEN Developer DEĞİL?
      #
      # Developer sürümü sınırsız ama LİSANSI YALNIZCA GELİŞTİRME
      # İÇİN — canlıda kullanmak lisans ihlali. Express ise ücretsiz
      # VE canlıda kullanılabilir; sınırı 10 GB veritabanı.
      #
      # Şimdiden Express kullanmak, yarın canlıya çıkarken sürpriz
      # yaşamamak demek: yerelde çalışan şey orada da çalışacak.
      MSSQL_PID: Express

      # ⚠️ Windows'taki SQL Server'ın Turkish_CI_AS, imajın varsayılanı
      # SQL_Latin1_General_CP1_CI_AS. Fark kozmetik değil: Türkçede
      # i/İ ve ı/I eşleşir, ç ğ ı ö ş ü doğru sıralanır. Latin1'de
      # ürün araması ve alfabetik listeler farklı sonuç verir.
      #
      # ⚠️ Bu değişken YALNIZCA volume boşken, sunucunun ilk
      # kurulumunda okunuyor. Sonradan eklersen hiçbir şey olmaz;
      # `down -v` ile sıfırdan kurmak gerekir.
      MSSQL_COLLATION: Turkish_CI_AS

    ports:
      # "dışarıdaki port : içerideki port"
      #
      # ⚠️ 1433 DEĞİL 14330 — bilerek.
      #
      # Windows'taki mevcut SQL Server'ın zaten 1433'ü kullanıyor.
      # Aynı portu istesekt Docker "port kullanımda" diye açılmazdı.
      # 14330 verince İKİSİ BİRDEN çalışabiliyor ve hangisine
      # bağlandığın port numarasından belli oluyor.
      - "14330:1433"

    volumes:
      # ⚠️ EN ÖNEMLİ SATIR.
      #
      # Container silinince içindeki her şey gider. Veritabanı
      # dosyaları container'ın içinde olsaydı `docker compose down`
      # demek tüm veriyi silmek olurdu.
      #
      # "volume" Docker'ın yönettiği kalıcı bir disk alanı. Container
      # gelir gider, volume kalır. Aşağıda tanımlı.
      - mssql-data:/var/opt/mssql

    # Bilgisayar yeniden başlarsa (ve Docker Desktop açılırsa)
    # veritabanı kendiliğinden ayağa kalksın.
    #
    # "unless-stopped": sen `docker compose stop` demedikçe başlat.
    # Yani bilerek durdurduysan Docker seni ezmiyor.
    restart: unless-stopped

    # Veritabanı GERÇEKTEN hazır mı?
    #
    # ⚠️ Container'ın "çalışıyor" görünmesi yetmez: SQL Server
    # açılırken 10-20 saniye kadar bağlantı kabul etmiyor. 2. adımda
    # API container'ı "veritabanı hazır olunca başla" diyebilsin diye
    # şimdiden ölçüyoruz.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # İlk açılış yavaş; bu süre boyunca başarısız denemeler
      # "sağlıksız" sayılmıyor.
      start_period: 30s

  # ============================================================
  #  API — ASP.NET Core 10
  # ============================================================
  api:
    # Hazır imaj yok, kendi imajımızı derliyoruz.
    build:
      # Derleme bağlamı: bu klasörün tamamı. Dockerfile içindeki
      # yollar (ETicaretAPI/ETicaretAPI.csproj) buna göre.
      context: .
      dockerfile: Dockerfile

    container_name: satik-api

    # ⚠️ SADECE "depends_on: db" YETMEZ.
    #
    # Düz `depends_on` yalnızca "db container'ı BAŞLATILDI" der.
    # SQL Server ise başladıktan sonra 10-20 saniye bağlantı kabul
    # etmiyor. API o aralıkta kalkarsa ilk sorguda patlar.
    #
    # `condition: service_healthy` db servisindeki healthcheck'in
    # geçmesini bekliyor — 1. adımda onu tam da bunun için yazmıştık.
    depends_on:
      db:
        condition: service_healthy

    environment:
      # ⚠️ NEDEN Development, NEDEN Production DEĞİL?
      #
      # Bu adımda tek bir şeyi değiştiriyoruz: API'nin nerede
      # çalıştığını. Aynı anda Production'a geçseydik CORS listesi
      # (Cors:AllowedOrigins hâlâ "admin.senindomainin.com" yer
      # tutucusu) admin paneli anında keserdi ve hatanın konteynerden
      # mi ayardan mı geldiğini anlayamazdık.
      #
      # ⚠️ Production'a geçiş Adım 3'ün işi: CORS listesi + gerçek
      # alan adı + UseForwardedHeaders birlikte çözülecek.
      ASPNETCORE_ENVIRONMENT: Development

      # ⚠️ appsettings.json'daki bağlantı dizesini EZİYOR.
      #
      # .NET'te iki alt çizgi (__) yapılandırmadaki iki nokta (:)
      # yerine geçiyor: ConnectionStrings__DefaultConnection
      # tam olarak ConnectionStrings:DefaultConnection demek.
      # Ortam değişkeni appsettings dosyalarından SONRA okunduğu için
      # kazanan bu oluyor.
      #
      # ⚠️ "Server=db" — localhost DEĞİL.
      #
      # Konteynerin içinde "localhost" KENDİSİ demek; orada SQL
      # Server yok. Compose her servise adıyla çözülen bir DNS kaydı
      # veriyor, yani "db" veritabanı konteynerine gidiyor.
      #
      # ⚠️ Port 1433, 14330 DEĞİL. 14330 dışarıya (Windows'a) açılan
      # port; konteynerler birbirine iç ağdan, gerçek portla ulaşıyor.
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ETicaretRealDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      # JWT imzalama anahtarı.
      #
      # ⚠️ appsettings.json'da "SET_IN_USER_SECRETS" yazıyor, gerçek
      # anahtar appsettings.Development.json'da — o dosya hem
      # .gitignore'da hem .dockerignore'da, yani imaja GİRMİYOR.
      # Konteyner anahtarı buradan alıyor, .env'den geliyor.
      #
      # ⚠️ Bu değer boş kalırsa API açılışta patlar (Program.cs'te
      # Jwt:Key null-forgiving "!" ile okunuyor). Sessizce güvensiz
      # çalışmaktansa patlaması iyi.
      Jwt__Key: ${JWT_KEY}

      # E-posta doğrulama linkinin işaret ettiği adres.
      #
      # ⚠️ Bu değer YANLIŞSA kayıt akışı sessizce kırılır: mail
      # gider, link tıklanır, hiçbir yere ulaşmaz. Alan adı gelince
      # (Adım 3) .env'de tek satır değişecek.
      Uygulama__TabanUrl: ${API_TABAN_URL:-http://localhost:5289}

      # X-Forwarded-For'a hangi ağlardan güvenilecek — yani Caddy'nin ağı.
      #
      # ⚠️ Bu değer olmadan Adım 3'ün hiçbir anlamı yok: API başlığı
      # görür ama yok sayar, herkes yine vekilin IP'si olarak görünür.
      Vekil__GuvenilirAglar: ${VEKIL_AGLARI:-172.16.0.0/12}

    # ⚠️ ARTIK PORT YAYIMLANMIYOR — ADIM 3'TE DEĞİŞTİ.
    #
    # 5289'u Caddy devraldı. API'yi de doğrudan açık bıraksaydık
    # X-Forwarded-For sahteciliğine kapı açardık: Caddy'yi atlayıp
    # doğrudan API'ye bağlanan biri başlığı kendi yazar ve rate limit
    # sayacını istediği gibi sıfırlardı. Tek giriş = tek kural.
    #
    # API'ye ulaşmak isteyen konteynerler iç ağdan "api:8080" diyor.

    volumes:
      # ⚠️ ÜRÜN GÖRSELLERİ — ADIM 2'NİN EN KRİTİK SATIRI.
      #
      # Bu satır olmasaydı 121 ürün görseli konteynerin içinde
      # kalırdı ve `docker compose down` ya da her `--build` sonrası
      # HEPSİ UÇARDI. Ürünler veritabanında durur, görselleri
      # gösteren yol 404 döner.
      #
      # ⚠️ NEDEN VOLUME DEĞİL, HOST KLASÖRÜ (bind mount)?
      #
      # 121 dosya zaten burada duruyor. Named volume kullansaydık
      # dosyaları içine ayrıca kopyalamak gerekirdi (Docker boş
      # volume'ü imajdan doldurur, imajda ise .dockerignore yüzünden
      # yoklar). Host klasörü bağlayınca kopyalama yok, üstelik
      # Windows'tan gözle görüp yönetebiliyorsun.
      #
      # ⚠️ SUNUCUDA (Adım 4) BU SATIR DEĞİŞECEK: orada host'ta böyle
      # bir klasör olmayacak, named volume'e dönecek ve görseller
      # oraya bir kez taşınacak.
      - ./ETicaretAPI/wwwroot/uploads:/app/wwwroot/uploads

    restart: unless-stopped

  # ============================================================
  #  CADDY — ters vekil
  #
  #  Tek işi gerçek istemci IP'sini API'ye taşımak. TLS'i Funnel
  #  sonlandırıyor; Caddy burada sertifika almıyor.
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: satik-caddy

    depends_on:
      - api

    ports:
      # LAN girişi — admin ve mobil buraya bağlanıyor.
      # Adres değişmedi, arkasındaki kutu değişti.
      - "5289:5289"

      # Funnel girişi — PROXY protokolü bu portta konuşuluyor.
      # ⚠️ Bu portu elle tarayıcıda açma; PROXY başlığı beklediği
      # için normal istek 2 sn takılıp düşer.
      - "9899:9899"

    volumes:
      # :ro — Caddy yapılandırmayı yalnızca okuyor.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    restart: unless-stopped

# Kalıcı disk alanları burada tanımlanıyor.
#
# `docker volume ls` ile görebilirsin; adı "eticaretapi_mssql-data"
# gibi olacak (klasör adı önek olarak ekleniyor).
volumes:
  mssql-data:
